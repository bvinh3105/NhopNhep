[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Same-origin path -> Netlify functions
# (gemini.js proxy removed 2026-09-08 — the live app never called it, it
# was an unauthenticated CORS-open relay signing every request with the
# real Gemini API key: pure quota/cost-abuse risk with zero legitimate use.)
[[redirects]]
  from = "/api/overpass"
  to = "/.netlify/functions/overpass"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
