[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Proxy Overpass API through same-origin path
# - Fixes CORS (some browsers strip ACAO for OSM even though server sets *)
# - Bypasses adblockers that block overpass-api.de directly
[[redirects]]
  from = "/api/overpass"
  to = "https://overpass-api.de/api/interpreter"
  status = 200
  force = true

# Proxy Wikimedia tiles as fallback (backup to CartoDB)
[[redirects]]
  from = "/tiles/wiki/*"
  to = "https://maps.wikimedia.org/osm-intl/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
